name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [catalog-coverage]
    defaults:
      run:
        working-directory: workspaces/${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: workspaces/${{ matrix.workspace }}/yarn.lock

      - name: Install
        run: yarn install --immutable

      - name: Type check
        run: yarn tsc

      - name: Lint
        run: yarn lint:all

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build:all

      # Regenerating in CI is only half the check: the committed report is the
      # reviewable record of the public API, so a drifted one must fail here
      # rather than be silently rewritten.
      - name: API reports
        run: |
          yarn build:api-reports
          git diff --exit-code -- 'plugins/*/report.api.md'

  leak-gate:
    name: Leak gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repository is public and is produced from a private portal repo.
      # These patterns are what that portal carries and this one must never gain.
      - name: Scan for internal identifiers and secrets
        run: |
          patterns=(
            'zntl'
            '\.internal\b'
            '\.lan\b'
            'C:/code'
            'C:\\Users'
            'pve01'
            'POSTGRES_PASSWORD'
            'GITHUB_TOKEN='
            'ghp_[A-Za-z0-9]{36}'
            'github_pat_[A-Za-z0-9_]{22,}'
            '"file:'
            '@internal/'
          )
          status=0
          # Excluded: this file (it contains the patterns), lockfiles, and the
          # vendored yarn release — third-party bundles whose minified text hits
          # '.internal' and '"file:' with no relation to anything of ours.
          for p in "${patterns[@]}"; do
            if git grep -nIE -- "$p" -- . \
              ':!.github/workflows/ci.yml' \
              ':(glob,exclude)**/yarn.lock' \
              ':(glob,exclude)**/.yarn/**'; then
              echo "::error::leak gate matched: $p"
              status=1
            fi
          done
          exit $status
